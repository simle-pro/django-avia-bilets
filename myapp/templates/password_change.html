{% extends 'base.html' %}

{% block title %}Смена пароля — EventHub{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-5">
        <div class="card shadow-lg border-0 rounded-4 p-4">
            <div class="card-body">
                <h3 class="fw-bold mb-3">Изменение пароля</h3>
                <p class="text-muted small mb-4">Для вашей безопасности используйте надежный пароль.</p>

                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary btn-lg w-100 mt-3 shadow-sm">
                        Изменить пароль
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
