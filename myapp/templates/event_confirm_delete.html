{% extends 'base.html' %}

{% block title %}Удаление события — EventHub{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card card-body shadow-sm text-center">
            <h2 class="text-danger mb-3">Удаление события</h2>
            <p class="lead">Вы действительно хотите удалить событие <strong>«{{ event.title }}»</strong>?</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Да, удалить</button>
                <a href="{{ event.get_absolute_url }}" class="btn btn-secondary">Отмена</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
